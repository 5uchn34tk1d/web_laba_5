<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
    <script src="calc.js" defer></script>
</head>
<body>
    <header id="top">
        <img src="1ogo.png" alt="Логотип сайта 5uchn34tk1d">
        <nav>
            <h1>Калькулятор стоимости заказа</h1>
        </nav>
    </header>

    <main id="calc">
        
        <label>
            Количество товара:<br>
            <input id="quantity" name="field-quantity" type="text" placeholder="Введите количество">
        </label><br>
        <label>
            Товар:<br>
            <select id="product" name="field-product">
                <option value="50">Ручка — 50 руб.</option>
                <option value="120">Тетрадь — 120 руб.</option>
                <option value="300">Папка — 300 руб.</option>
                <option value="30">Карандаш — 30 руб.</option>
                <option value="90">Маркер — 90 руб.</option>
                <option value="450">Ежедневник — 450 руб.</option>
            </select>
        </label><br>
        <br>
        <button id="add-button" type="button">Добавить в заказ</button>
        <button id="calc-button" type="button">Рассчитать</button>
        <button id="clear-button" type="button">Очистить заказ</button>
        <p id="error"></p>
        <div id="order-box" hidden>
            <table>
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Количество</th>
                        <th>Стоимость</th>
                    </tr>
                </thead>
                <tbody id="order-body"></tbody>
            </table>
        </div>
        <p id="result"></p>
    </main>

    <footer>
        <p> (c) 5uchn34tk1d ^_^</p>
    </footer>
</body>
</html>
